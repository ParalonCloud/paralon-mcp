# Publishes to npm from a pushed tag vX.Y.Z, with provenance (npm Trusted
# Publishing: no npm token is stored anywhere). The npm page then shows the
# commit and workflow the package was built from.
name: publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing and the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 ships npm 11: Trusted Publishing (the OIDC exchange) needs
      # npm 11.5.1 or later. Node 22's npm 10.9 got a 404 on the first
      # release (2026-11-19).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json, server.json and server.js
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$v"
          test "$(node -p "require('./server.json').version")" = "$v"
          grep -q "version: \"$v\"" server.js
      - run: npm --version
      - run: npm ci
      - run: node --check server.js
      - run: node smoke-test.mjs
      - run: npm publish --provenance --access public
      # The official MCP registry (registry.modelcontextprotocol.io), by the
      # same OIDC token: the io.github.ParalonCloud namespace is granted to a
      # workflow of the ParalonCloud org, so no personal access token. The
      # registry checks the npm package (its mcpName), so wait until npm
      # serves the new version first (it takes a few minutes).
      - name: Wait until npm serves this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 40); do
            npm view "@paraloncloud/mcp@$v" version 2>/dev/null | grep -qx "$v" && exit 0
            sleep 15
          done
          echo "npm does not serve $v after 10 minutes"; exit 1
      - name: Publish to the official MCP registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
          # sha256 of mcp-publisher_linux_amd64.tar.gz of that release
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mcp-publisher.tgz" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/mcp-publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

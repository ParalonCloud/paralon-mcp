# Publishes to npm from a pushed tag vX.Y.Z, with provenance (npm Trusted
# Publishing: no npm token is stored anywhere). The npm page then shows the
# commit and workflow the package was built from.
name: publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing and the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 ships npm 11: Trusted Publishing (the OIDC exchange) needs
      # npm 11.5.1 or later. Node 22's npm 10.9 got a 404 on the first
      # release (2026-11-19).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json, server.json and server.js
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$v"
          test "$(node -p "require('./server.json').version")" = "$v"
          grep -q "version: \"$v\"" server.js
      - run: npm --version
      - run: npm ci
      - run: node --check server.js
      - run: node smoke-test.mjs
      - run: npm publish --provenance --access public
